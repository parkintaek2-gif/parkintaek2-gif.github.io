<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="K Culture Wire">
  <!--
    K Culture Wire 파비콘.
    ⚠ 16픽셀에서 읽혀야 한다 — 그래서 글자 하나(K)와 굵은 획만 쓴다. 가는 선은 사라진다.
    ⭐ 빛깔은 우리 숏영상과 같은 것을 쓴다(바탕 #140f16 · 글자 #e9e6dd · 강조 #f0b6c8).
       탭·검색결과·영상이 같은 얼굴이어야 한 곳에서 본 사람이 다른 곳에서 알아본다.
    ⛔ 차트선 아이콘(public/favicon.svg)을 쓰지 않는다 — 그건 SeoulMarkets 결이다.
  -->
  <rect width="32" height="32" rx="6" fill="#140f16"/>
  <!-- K 의 세로 기둥 -->
  <rect x="7" y="7" width="4.2" height="18" fill="#e9e6dd"/>
  <!-- 위로 뻗는 팔 -->
  <path d="M12.6 16.2 L21.5 7 h5.6 l-9.2 9.4 z" fill="#e9e6dd"/>
  <!-- 아래로 뻗는 팔 — 강조색으로 둔다. 16픽셀에서 이 한 점이 눈에 남는다 -->
  <path d="M12.6 15.8 L18.1 15.6 L27.4 25 h-5.9 z" fill="#f0b6c8"/>
</svg>
