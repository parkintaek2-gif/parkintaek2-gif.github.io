<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="K Culture Wire — Korean pop culture, in numbers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1826"/>
      <stop offset="1" stop-color="#14111c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 사이트의 순위 막대 모티프 — 「숫자로 K컬처」 -->
  <g transform="translate(90,150)" fill="#6b3fa0" opacity="0.55">
    <rect x="0" y="0"   width="620" height="26" rx="4"/>
    <rect x="0" y="46"  width="470" height="26" rx="4"/>
    <rect x="0" y="92"  width="360" height="26" rx="4"/>
    <rect x="0" y="138" width="250" height="26" rx="4"/>
  </g>
  <text x="90" y="430" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="#ece9f3">K Culture <tspan fill="#b491e8">Wire</tspan></text>
  <text x="94" y="500" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="38" fill="#a49cb8">Korean pop culture, in numbers.</text>
  <text x="94" y="556" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="26" fill="#635d75">Charts, viewership, fandom and rankings — measured, sourced, in English.</text>
</svg>
