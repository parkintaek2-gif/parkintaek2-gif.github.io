<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="All 17 Korean regions' small-merchant expectation BSI sit below the neutral 100, from 64.5 to 80.6">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#e2e5ea" stroke-width="2"/>
  <text x="80" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#0b1f3a">No region's merchants expect better times</text>
  <text x="80" y="126" font-family="Georgia, serif" font-size="20" fill="#5b6472">Small-merchant expectation BSI by region, latest month. 100 = neutral. Our KOSIS pull.</text>

  <!-- scale 60..105 mapped x 200..1120 -->
  <!-- neutral 100 line -->
  <line x1="1004" y1="170" x2="1004" y2="560" stroke="#0b1f3a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="1004" y="160" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#0b1f3a" text-anchor="middle">100 · neutral</text>
  <text x="1010" y="586" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8a929e">not one region reaches it</text>

  <!-- rows: region, value; x = 200 + (v-60)*20.4 -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="16">
    <!-- 전남 80.6 -->
    <text x="196" y="205" fill="#33404f" text-anchor="end">South Jeolla</text>
    <rect x="200" y="192" width="420" height="20" rx="3" fill="#c98a1a"/>
    <text x="628" y="207" font-weight="700" fill="#c98a1a">80.6</text>
    <!-- 전북 75.8 -->
    <text x="196" y="245" fill="#33404f" text-anchor="end">North Jeolla</text>
    <rect x="200" y="232" width="322" height="20" rx="3" fill="#d8a24f"/>
    <text x="530" y="247" font-weight="700" fill="#c98a1a">75.8</text>
    <!-- 대구 73.7 -->
    <text x="196" y="285" fill="#33404f" text-anchor="end">Daegu</text>
    <rect x="200" y="272" width="279" height="20" rx="3" fill="#d8a24f"/>
    <text x="487" y="287" font-weight="700" fill="#c98a1a">73.7</text>
    <!-- 부산/경기 70.1 -->
    <text x="196" y="325" fill="#33404f" text-anchor="end">Busan / Gyeonggi</text>
    <rect x="200" y="312" width="206" height="20" rx="3" fill="#c07a4f"/>
    <text x="414" y="327" font-weight="700" fill="#b53434">70.1</text>
    <!-- 서울 65.7 -->
    <text x="196" y="365" fill="#0b1f3a" text-anchor="end" font-weight="700">Seoul</text>
    <rect x="200" y="352" width="116" height="20" rx="3" fill="#b53434"/>
    <text x="324" y="367" font-weight="700" fill="#b53434">65.7</text>
    <!-- 대전 64.5 -->
    <text x="196" y="405" fill="#33404f" text-anchor="end">Daejeon</text>
    <rect x="200" y="392" width="92" height="20" rx="3" fill="#b53434"/>
    <text x="300" y="407" font-weight="700" fill="#b53434">64.5 · lowest</text>
  </g>

  <text x="80" y="470" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0b1f3a">All 17 regions below neutral — and the capital sits near the bottom.</text>
  <text x="80" y="505" font-family="Georgia, serif" font-size="18" fill="#5b6472">The just-released national 95.1 is one month newer, still under 100, not yet split by region.</text>
  <text x="80" y="606" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#8a929e">SeoulMarkets · SEMAS BSI via KOSIS (DT_S0001N_005) · a map of expectations, not places · not advice</text>
</svg>
