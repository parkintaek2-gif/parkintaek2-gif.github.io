<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 400" font-family="Georgia,'Times New Roman',serif" role="img" aria-label="Biggest movers in Korea won-basis import prices over the year to July 2026">
<rect width="768" height="400" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="700" fill="#0f172a">What got most expensive to import</text>
<text x="20" y="42" font-size="12" fill="#64748b">Won-basis import price, 12-month change to Jul 2026 (top risers)</text>
<line x1="210" y1="52" x2="210" y2="370" stroke="#64748b"/>
<rect x="210.0" y="61.7" width="502.0" height="26" fill="#b4472a" rx="2"/><text x="200" y="78.7" text-anchor="end" font-size="12.5" fill="#0f172a">Synthetic rubber</text><text x="718.0" y="78.7" text-anchor="start" font-size="12" font-weight="700" fill="#b4472a">+96%</text><rect x="210.0" y="107.1" width="405.8" height="26" fill="#b4472a" rx="2"/><text x="200" y="124.1" text-anchor="end" font-size="12.5" fill="#0f172a">Diesel</text><text x="621.8" y="124.1" text-anchor="start" font-size="12" font-weight="700" fill="#b4472a">+77.6%</text><rect x="210.0" y="152.6" width="401.6" height="26" fill="#b4472a" rx="2"/><text x="200" y="169.6" text-anchor="end" font-size="12.5" fill="#0f172a">Jet fuel</text><text x="617.6" y="169.6" text-anchor="start" font-size="12" font-weight="700" fill="#b4472a">+76.8%</text><rect x="210.0" y="198.0" width="351.9" height="26" fill="#b4472a" rx="2"/><text x="200" y="215.0" text-anchor="end" font-size="12.5" fill="#0f172a">Computer memory</text><text x="567.9" y="215.0" text-anchor="start" font-size="12" font-weight="700" fill="#b4472a">+67.3%</text><rect x="210.0" y="243.4" width="347.7" height="26" fill="#b4472a" rx="2"/><text x="200" y="260.4" text-anchor="end" font-size="12.5" fill="#0f172a">Printed circuit boards</text><text x="563.7" y="260.4" text-anchor="start" font-size="12" font-weight="700" fill="#b4472a">+66.5%</text><rect x="210.0" y="288.9" width="347.7" height="26" fill="#b4472a" rx="2"/><text x="200" y="305.9" text-anchor="end" font-size="12.5" fill="#0f172a">Bare circuit boards</text><text x="563.7" y="305.9" text-anchor="start" font-size="12" font-weight="700" fill="#b4472a">+66.5%</text><rect x="210.0" y="334.3" width="322.1" height="26" fill="#b4472a" rx="2"/><text x="200" y="351.3" text-anchor="end" font-size="12.5" fill="#0f172a">Basic organic chemicals</text><text x="538.1" y="351.3" text-anchor="start" font-size="12" font-weight="700" fill="#b4472a">+61.6%</text>
<text x="712" y="394" text-anchor="end" font-size="10" fill="#64748b">Source: Bank of Korea via KOSIS (301/DT_401Y015)</text>
</svg>