<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 380" font-family="Georgia,'Times New Roman',serif" role="img" aria-label="Biggest risers in Korea producer prices over the year to July 2026, led by integrated circuits and memory">
<rect width="768" height="380" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="700" fill="#0f172a">The risers are almost all silicon</text>
<text x="20" y="42" font-size="12" fill="#64748b">Producer price, 12-month change to Jul 2026 (top risers)</text>
<rect x="220" y="61.8" width="488.0" height="30" fill="#b4472a" rx="2"/><text x="210" y="80.8" text-anchor="end" font-size="12.5" fill="#0f172a">Integrated circuits</text><text x="714.0" y="80.8" font-size="12" font-weight="700" fill="#b4472a">+315%</text><rect x="220" y="111.5" width="450.4" height="30" fill="#b4472a" rx="2"/><text x="210" y="130.5" text-anchor="end" font-size="12.5" fill="#0f172a">Computer memory</text><text x="676.4" y="130.5" font-size="12" font-weight="700" fill="#b4472a">+290.7%</text><rect x="220" y="161.2" width="275.6" height="30" fill="#b4472a" rx="2"/><text x="210" y="180.2" text-anchor="end" font-size="12.5" fill="#0f172a">Other refined petroleum</text><text x="501.6" y="180.2" font-size="12" font-weight="700" fill="#b4472a">+177.9%</text><rect x="220" y="210.8" width="223.4" height="30" fill="#b4472a" rx="2"/><text x="210" y="229.8" text-anchor="end" font-size="12.5" fill="#0f172a">Semiconductors</text><text x="449.4" y="229.8" font-size="12" font-weight="700" fill="#b4472a">+144.2%</text><rect x="220" y="260.5" width="221.8" height="30" fill="#b4472a" rx="2"/><text x="210" y="279.5" text-anchor="end" font-size="12.5" fill="#0f172a">Lubricants &amp; refined oil</text><text x="447.8" y="279.5" font-size="12" font-weight="700" fill="#b4472a">+143.2%</text><rect x="220" y="310.2" width="221.2" height="30" fill="#b4472a" rx="2"/><text x="210" y="329.2" text-anchor="end" font-size="12.5" fill="#0f172a">Computers &amp; peripherals</text><text x="447.2" y="329.2" font-size="12" font-weight="700" fill="#b4472a">+142.8%</text>
<text x="708" y="374" text-anchor="end" font-size="10" fill="#64748b">Source: Bank of Korea via KOSIS (301/DT_404Y014)</text>
</svg>