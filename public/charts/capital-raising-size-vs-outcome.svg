<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 356" font-family="Georgia,'Times New Roman',serif" role="img" aria-label="Three ways Korean companies raised capital this week, comparing the biggest filing against a smaller one that better served shareholders in each category">
<rect width="768" height="356" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#0f172a">Size didn't predict the outcome, in all three</text>
<text x="24" y="46" font-size="12" fill="#64748b">DART filings, 2026-08-25 to 2026-09-01. Two filers per category — the amount raised does not track the outcome.</text>
<text x="24" y="78" font-size="13" font-weight="700" fill="#0f172a">Buybacks</text><text x="118" y="100" font-size="12.5" font-weight="700" fill="#1d4ed8">셀트리온 — ₩1000억 — no cancel</text><text x="118" y="120" font-size="12.5" font-weight="700" fill="#b91c1c">진양폴리우레탄 — ₩10억 — cancels</text><line x1="20" y1="140" x2="748" y2="140" stroke="#e2e8f0"/><text x="24" y="170" font-size="13" font-weight="700" fill="#0f172a">Rights issues</text><text x="118" y="192" font-size="12.5" font-weight="700" fill="#1d4ed8">Samsung Biologics — ₩30009.4억 — 4.7% dilution</text><text x="118" y="212" font-size="12.5" font-weight="700" fill="#b91c1c">PhionX — ₩100억 — 53.8% dilution</text><line x1="20" y1="232" x2="748" y2="232" stroke="#e2e8f0"/><text x="24" y="262" font-size="13" font-weight="700" fill="#0f172a">Convertible bonds</text><text x="118" y="284" font-size="12.5" font-weight="700" fill="#1d4ed8">Sungho Electronics — ₩130억 — 1.02% dilution</text><text x="118" y="304" font-size="12.5" font-weight="700" fill="#b91c1c">ITCEN CTS — ₩50억 — 6.76% dilution</text>
<text x="744" y="348" text-anchor="end" font-size="10" fill="#64748b">Source: DART (Financial Supervisory Service)</text>
</svg>