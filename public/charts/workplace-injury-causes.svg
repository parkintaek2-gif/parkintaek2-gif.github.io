<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Georgia,'Times New Roman',serif" role="img" aria-label="Top 5 causes of workplace injury in Korea, 2024, with 5-year change from 2020: falls (slips/trips) rank first at 28,244 cases, followed by occupational disease which grew fastest at plus 68.8 percent">
<rect width="700" height="300" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="700" fill="#0f172a">Korea's top 5 workplace injury causes, 2024</text>
<rect x="160" y="55.4" width="391.3" height="26" fill="#1d4ed8" rx="2"/><text x="150" y="72.4" text-anchor="end" font-size="12" fill="#0f172a">넘어짐</text><text x="557.3" y="72.4" font-size="11" font-weight="700" fill="#1d4ed8">28,244 (+36.7%)</text><rect x="160" y="100.2" width="374.0" height="26" fill="#b91c1c" rx="2"/><text x="150" y="117.2" text-anchor="end" font-size="12" fill="#0f172a">업무상질병</text><text x="540.0" y="117.2" font-size="11" font-weight="700" fill="#b91c1c">26,998 (+68.8%)</text><rect x="160" y="145.0" width="203.0" height="26" fill="#1d4ed8" rx="2"/><text x="150" y="162.0" text-anchor="end" font-size="12" fill="#0f172a">떨어짐</text><text x="369.0" y="162.0" font-size="11" font-weight="700" fill="#1d4ed8">14,655 (+1.7%)</text><rect x="160" y="189.8" width="179.3" height="26" fill="#1d4ed8" rx="2"/><text x="150" y="206.8" text-anchor="end" font-size="12" fill="#0f172a">끼임</text><text x="345.3" y="206.8" font-size="11" font-weight="700" fill="#1d4ed8">12,941 (+0.4%)</text><rect x="160" y="234.6" width="155.4" height="26" fill="#b91c1c" rx="2"/><text x="150" y="251.6" text-anchor="end" font-size="12" fill="#0f172a">부딪힘</text><text x="321.4" y="251.6" font-size="11" font-weight="700" fill="#b91c1c">11,220 (+49.5%)</text>
<text x="610" y="294" text-anchor="end" font-size="10" fill="#64748b">Source: KOSIS, Ministry of Employment and Labor industrial accident statistics, 2020-2024</text>
</svg>