<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="NPS H1 2026 money-weighted returns by asset class: domestic equity 107 percent, others far lower">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#e2e5ea" stroke-width="2"/>
  <text x="80" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#0b1f3a">One number, with three words attached</text>
  <text x="80" y="126" font-family="Georgia, serif" font-size="20" fill="#5b6472">NPS H1 2026 returns by asset class — money-weighted, provisional. The fund's own figure.</text>

  <!-- bars -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <!-- domestic equity 107.37 -->
    <rect x="330" y="180" width="620" height="46" rx="4" fill="#1e5bbf"/>
    <text x="322" y="210" font-size="17" fill="#33404f" text-anchor="end">domestic equity</text>
    <text x="962" y="210" font-size="18" font-weight="700" fill="#1e5bbf">107.37%</text>
    <!-- overseas equity 17.81 -->
    <rect x="330" y="242" width="103" height="46" rx="4" fill="#4a86d8"/>
    <text x="322" y="272" font-size="17" fill="#33404f" text-anchor="end">overseas equity</text>
    <text x="445" y="272" font-size="18" font-weight="700" fill="#4a86d8">17.81%</text>
    <!-- alternatives 9.60 -->
    <rect x="330" y="304" width="56" height="46" rx="4" fill="#7a8699"/>
    <text x="322" y="334" font-size="17" fill="#33404f" text-anchor="end">alternatives</text>
    <text x="398" y="334" font-size="18" font-weight="700" fill="#5b6472">9.60%</text>
    <!-- overseas bonds 9.22 -->
    <rect x="330" y="366" width="53" height="46" rx="4" fill="#7a8699"/>
    <text x="322" y="396" font-size="17" fill="#33404f" text-anchor="end">overseas bonds</text>
    <text x="395" y="396" font-size="18" font-weight="700" fill="#5b6472">9.22%</text>
    <!-- domestic bonds -3.00 -->
    <rect x="313" y="428" width="17" height="46" rx="4" fill="#b53434"/>
    <text x="305" y="458" font-size="17" fill="#33404f" text-anchor="end">domestic bonds</text>
    <text x="336" y="458" font-size="18" font-weight="700" fill="#b53434">−3.00%</text>
  </g>

  <text x="80" y="524" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0b1f3a">Whole fund 27.22% · assets 1,865.6tn won (end-June 2026).</text>
  <text x="80" y="556" font-family="Georgia, serif" font-size="19" fill="#5b6472">‘Money-weighted’ ≠ the market's move. ‘Provisional’ can still change.</text>
  <text x="80" y="600" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#8a929e">SeoulMarkets · NPS official disclosure, labels kept · not a market return · not advice</text>
</svg>
