<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Georgia,'Times New Roman',serif" role="img" aria-label="Three bars comparing 2025 to 2026 for Korea's offshore-asset reporting: total amount up 13.3%, number of filers up 9.1%, average amount per filer up only 3.9%">
<rect width="640" height="260" fill="#ffffff"/>
<text x="20" y="24" font-size="15" font-weight="700" fill="#0f172a">Most of the headline increase is more filers, not richer ones</text>
<text x="60" y="52.0" font-size="12" font-weight="700" fill="#0f172a">Total reported (₩tn) — +13.3%</text><rect x="60" y="56.0" width="414.3" height="19.333333333333332" fill="#64748b" rx="2"/><text x="480.3" y="73.3" font-size="10.5" fill="#64748b">2025: 94.5tn</text><rect x="60" y="77.3" width="469.6" height="19.333333333333332" fill="#1d4ed8" rx="2"/><text x="535.6" y="94.7" font-size="10.5" font-weight="700" fill="#1d4ed8">2026: 107.1tn</text><text x="60" y="108.7" font-size="12" font-weight="700" fill="#0f172a">Number of filers — +9.1%</text><rect x="60" y="112.7" width="430.3" height="19.333333333333332" fill="#64748b" rx="2"/><text x="496.3" y="130.0" font-size="10.5" fill="#64748b">2025: 6858</text><rect x="60" y="134.0" width="469.6" height="19.333333333333332" fill="#1d4ed8" rx="2"/><text x="535.6" y="151.3" font-size="10.5" font-weight="700" fill="#1d4ed8">2026: 7484</text><text x="60" y="165.3" font-size="12" font-weight="700" fill="#0f172a">Avg. per filer (₩bn) — +3.9%</text><rect x="60" y="169.3" width="452.2" height="19.333333333333332" fill="#64748b" rx="2"/><text x="518.2" y="186.7" font-size="10.5" fill="#64748b">2025: 13.78</text><rect x="60" y="190.7" width="469.6" height="19.333333333333332" fill="#1d4ed8" rx="2"/><text x="535.6" y="208.0" font-size="10.5" font-weight="700" fill="#1d4ed8">2026: 14.31</text>
<text x="600" y="252" text-anchor="end" font-size="10" fill="#64748b">Source: National Tax Service press release, 2 Sep 2026 (aggregate figures; per-filer average computed by SeoulMarkets)</text>
</svg>