<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Georgia,'Times New Roman',serif" role="img" aria-label="Distribution of the male-to-female average pay ratio across 2,282 Korean listed companies with at least 10 men and 10 women each, H1 2026: most companies cluster in the 5 to 50 percent men-earn-more range">
<rect width="700" height="300" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="700" fill="#0f172a">Where Korean companies sit on the gender pay gap</text>
<rect x="220" y="55.4" width="7.2" height="26" fill="#1d4ed8" rx="2"/><text x="210" y="72.4" text-anchor="end" font-size="11.5" fill="#0f172a">Women earn more (5%+)</text><text x="233.2" y="72.4" font-size="11" font-weight="700" fill="#1d4ed8">1.4%</text><rect x="220" y="100.2" width="13.9" height="26" fill="#1d4ed8" rx="2"/><text x="210" y="117.2" text-anchor="end" font-size="11.5" fill="#0f172a">Roughly equal (within 5%)</text><text x="239.9" y="117.2" font-size="11" font-weight="700" fill="#1d4ed8">2.6%</text><rect x="220" y="145.0" width="356.5" height="26" fill="#1d4ed8" rx="2"/><text x="210" y="162.0" text-anchor="end" font-size="11.5" fill="#0f172a">Men +5–50%</text><text x="582.5" y="162.0" font-size="11" font-weight="700" fill="#1d4ed8">67.7%</text><rect x="220" y="189.8" width="131.8" height="26" fill="#1d4ed8" rx="2"/><text x="210" y="206.8" text-anchor="end" font-size="11.5" fill="#0f172a">Men +50–100%</text><text x="357.8" y="206.8" font-size="11" font-weight="700" fill="#1d4ed8">25.0%</text><rect x="220" y="234.6" width="17.5" height="26" fill="#1d4ed8" rx="2"/><text x="210" y="251.6" text-anchor="end" font-size="11.5" fill="#0f172a">Men more than double</text><text x="243.5" y="251.6" font-size="11" font-weight="700" fill="#1d4ed8">3.3%</text>
<text x="630" y="294" text-anchor="end" font-size="10" fill="#64748b">Source: DART half-year reports (empSttus), 2,282 companies, H1 2026</text>
</svg>