<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Small-merchant BSI: hope and reality both sit below the neutral 100 line">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#e2e5ea" stroke-width="2"/>
  <text x="80" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#0b1f3a">A high water mark, still under water</text>
  <text x="80" y="126" font-family="Georgia, serif" font-size="21" fill="#5b6472">Small-merchant BSI, overall conditions. 100 = neutral. Our own KOSIS pull.</text>

  <!-- neutral line -->
  <line x1="120" y1="200" x2="1120" y2="200" stroke="#0b1f3a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="1120" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#0b1f3a" text-anchor="end">100 · neutral — not crossed in 36 months</text>

  <!-- expected bar (hope) avg 80 -->
  <rect x="250" y="272" width="180" height="228" rx="4" fill="#c98a1a"/>
  <text x="340" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#c98a1a" text-anchor="middle">80</text>
  <text x="340" y="528" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#33404f" text-anchor="middle">expected (hope)</text>

  <!-- felt bar (reality) avg 63.3 -->
  <rect x="520" y="320" width="180" height="180" rx="4" fill="#b53434"/>
  <text x="610" y="310" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#b53434" text-anchor="middle">63.3</text>
  <text x="610" y="528" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#33404f" text-anchor="middle">felt (reality)</text>

  <!-- gap bracket -->
  <line x1="770" y1="272" x2="770" y2="320" stroke="#5b6472" stroke-width="2"/>
  <text x="790" y="300" font-family="Georgia, serif" font-size="19" fill="#5b6472">~17-point gap, month after month</text>

  <!-- Sept headline -->
  <text x="790" y="380" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#0b1f3a">Sept expectation: 95.1</text>
  <text x="790" y="410" font-family="Georgia, serif" font-size="18" fill="#5b6472">a year-high — still below 100</text>

  <text x="80" y="575" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#0b1f3a">Averages, last 36 months. Neither hope nor reality reached neutral.</text>
  <text x="80" y="606" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#8a929e">SeoulMarkets · SEMAS BSI via KOSIS (DT_S0001N_001) · not a forecast · not advice</text>
</svg>
