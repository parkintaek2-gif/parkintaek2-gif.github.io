<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="Georgia,'Times New Roman',serif" role="img" aria-label="Year-on-year change in Korea's August CPI: overall +3.09%, communications overall +16.63%, but landline and internet fees barely moved while the mobile phone fee sub-index jumped 26.74% on a base effect from last year's discount">
<rect width="680" height="290" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="700" fill="#0f172a">One phone bill line moved 26.7% — the rest of "communications" barely did</text>
<rect x="170" y="56.0" width="45.2" height="24" fill="#1d4ed8" rx="2"/><text x="160" y="72.0" text-anchor="end" font-size="12" fill="#0f172a">Overall CPI</text><text x="221.2" y="72.0" font-size="11.5" font-weight="700" fill="#1d4ed8">+3.09%</text><rect x="170" y="100.0" width="243.4" height="24" fill="#1d4ed8" rx="2"/><text x="160" y="116.0" text-anchor="end" font-size="12" fill="#0f172a">Communications (all)</text><text x="419.4" y="116.0" font-size="11.5" font-weight="700" fill="#1d4ed8">+16.63%</text><rect x="170" y="144.0" width="1.0" height="24" fill="#1d4ed8" rx="2"/><text x="160" y="160.0" text-anchor="end" font-size="12" fill="#0f172a">Landline fee</text><text x="177.0" y="160.0" font-size="11.5" font-weight="700" fill="#1d4ed8">+0.07%</text><rect x="170" y="188.0" width="0.0" height="24" fill="#1d4ed8" rx="2"/><text x="160" y="204.0" text-anchor="end" font-size="12" fill="#0f172a">Internet fee</text><text x="176.0" y="204.0" font-size="11.5" font-weight="700" fill="#1d4ed8">+0%</text><rect x="170" y="232.0" width="391.3" height="24" fill="#b91c1c" rx="2"/><text x="160" y="248.0" text-anchor="end" font-size="12" fill="#0f172a">Mobile phone fee</text><text x="567.3" y="248.0" font-size="11.5" font-weight="700" fill="#b91c1c">+26.74%</text>
<text x="620" y="284" text-anchor="end" font-size="10" fill="#64748b">Source: KOSIS, CPI by expenditure category, Aug 2025 vs Aug 2026, whole country</text>
</svg>