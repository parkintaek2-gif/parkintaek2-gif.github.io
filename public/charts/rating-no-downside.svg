<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Korean broker ratings almost never say sell: 89 sell calls in twelve years">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#e2e5ea" stroke-width="2"/>
  <text x="80" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#0b1f3a">A scale that points only one way</text>
  <text x="80" y="132" font-family="Georgia, serif" font-size="22" fill="#5b6472">55,580 rated Korean broker reports since 2014. Counts, not price targets.</text>

  <!-- BUY -->
  <text x="80" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#0b1f3a">BUY</text>
  <rect x="230" y="205" width="880" height="34" rx="5" fill="#1e7a44"/>
  <text x="250" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">the overwhelming majority</text>

  <!-- HOLD -->
  <text x="80" y="318" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#0b1f3a">HOLD</text>
  <rect x="230" y="295" width="66" height="34" rx="5" fill="#c98a1a"/>
  <text x="312" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#c98a1a">fell 9.7% &#8594; 3.3%</text>

  <!-- SELL -->
  <text x="80" y="408" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#0b1f3a">SELL</text>
  <rect x="230" y="385" width="8" height="34" rx="3" fill="#b53434"/>
  <text x="254" y="410" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#b53434">89 sell calls &#8212; in twelve years, total</text>

  <text x="80" y="500" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#0b1f3a">If "buy" is almost every rating, "buy" is the baseline &#8212; not the message.</text>
  <text x="80" y="590" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#8a929e">SeoulMarkets &#183; distribution of ratings, reproducible &#183; this is a statistic, not advice</text>
</svg>
