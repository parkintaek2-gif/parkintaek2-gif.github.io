<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Georgia,'Times New Roman',serif" role="img" aria-label="Distribution of average employee tenure across 2,839 Korean listed companies, FY2025: most companies cluster between 3 and 10 years, a small tail holds workers 15 years or more">
<rect width="700" height="300" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="700" fill="#0f172a">Where Korean listed firms sit on staff tenure</text>
<rect x="170" y="55.4" width="140.9" height="26" fill="#1d4ed8" rx="2"/><text x="160" y="72.4" text-anchor="end" font-size="12" fill="#0f172a">Under 3 years</text><text x="316.9" y="72.4" font-size="11" font-weight="700" fill="#1d4ed8">12.4%</text><rect x="170" y="100.2" width="400.0" height="26" fill="#1d4ed8" rx="2"/><text x="160" y="117.2" text-anchor="end" font-size="12" fill="#0f172a">3–6 years</text><text x="576.0" y="117.2" font-size="11" font-weight="700" fill="#1d4ed8">35.3%</text><rect x="170" y="145.0" width="353.3" height="26" fill="#1d4ed8" rx="2"/><text x="160" y="162.0" text-anchor="end" font-size="12" fill="#0f172a">6–10 years</text><text x="529.3" y="162.0" font-size="11" font-weight="700" fill="#1d4ed8">31.2%</text><rect x="170" y="189.8" width="174.5" height="26" fill="#1d4ed8" rx="2"/><text x="160" y="206.8" text-anchor="end" font-size="12" fill="#0f172a">10–15 years</text><text x="350.5" y="206.8" font-size="11" font-weight="700" fill="#1d4ed8">15.4%</text><rect x="170" y="234.6" width="64.7" height="26" fill="#1d4ed8" rx="2"/><text x="160" y="251.6" text-anchor="end" font-size="12" fill="#0f172a">15+ years</text><text x="240.7" y="251.6" font-size="11" font-weight="700" fill="#1d4ed8">5.7%</text>
<text x="630" y="294" text-anchor="end" font-size="10" fill="#64748b">Source: DART annual reports (empSttus), 2,839 companies, FY2025</text>
</svg>